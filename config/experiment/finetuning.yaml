type: finetuning
langs:
  - yo
model: allenai/Olmo-3-1025-7B
las_tokenizer_path: /home/USER/unimixlm/multilingual/tokenizers/unimix-en_yo-Olmo-3-1025-7B
output_dir: ./finetuned_model
epochs: 1
batch_size: 16
gradient_accumulation_steps: 1
dataset:
  pack_dataset: true
  align_to_max_seq_len: true
  add_eos_between_samples: true
  drop_last_pack: false
  max_seq_len: 128
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules: ""
learning_rate: 5e-4
wandb:
  enabled: true
  project: "unimixlm"
  entity: "therootof3"
  run_name: ${experiment.model}-${experiment.langs}-lr${experiment.learning_rate}-packed
  tags: []
  notes: null
