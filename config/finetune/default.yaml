defaults:
  - model: olmo3-1025-7b
  - logger: wandb-andrzej
  - lora: r16-k32
  - _self_

langs:
  - yor

output_dir: ./finetuned_model

# LAS tokenizer configuration
# Set las_tokenizer_path to use LAS tokenizers, or null to use original tokenizer
las_tokenizer_path: /home/USER/unimixlm/olmo3_las_tokenizers/las-tokenizers-Olmo-3-1025-7B-yor
# las_mode: "base" to use base_tokenizer.json to tokenize all data,
# or "per_language" to use language-specific tokenizers (langspec_{lang}.json) for a subset in each language
las_mode: "base"

epochs: 1
batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 5e-4
val_fraction: 0.01

dataset:
  size: 10M
  max_seq_len: 1024
