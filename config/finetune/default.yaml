defaults:
  - model: olmo3-1025-7b
  - logger: wandb-andrzej
  - lora: r16-k32
  - _self_

langs:
  - yor
  - fil

output_dir: ./finetuned_model


# LAS tokenizer configuration
# las_mode: "original" = use the model's original tokenizer (no LAS)
#           "base"     = use base_tokenizer.json for all languages
#           "langspec" = use langspec_{lang}_Latn.json per language
las_mode: "langspec"
# Path to directory containing base_tokenizer.json and langspec_{lang}_Latn.json files.
# Required for las_mode "base" or "langspec", ignored for "original".
las_tokenizer_path: /home/USER/unimixlm/olmo3_las_tokenizers/las-tokenizers-Olmo-3-1025-7B-fil_yor
model_tokenizer_path: /home/USER/unimixlm/olmo3_las_tokenizers/model_tokenizer

seed: 42
epochs: 1
per_device_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 5e-4
val_fraction: 0.01

dataset:
  size: 10M
  max_seq_len: 1024
