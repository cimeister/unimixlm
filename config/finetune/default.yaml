defaults:
  - model: olmo3-1025-7b
  - logger: wandb-unimix
  - lora: r16-k32
  - _self_

# langs:
#   fil: 1.0
#   eng: 0.2

output_dir: ./finetuned_model


# LAS tokenizer configuration
# las_mode: "original" = use the model's original tokenizer (no LAS)
#           "base"     = use base_tokenizer.json for all languages
#           "langspec" = use langspec_{lang}_Latn.json per language
las_mode: "original"
# Path to directory containing base_tokenizer.json and langspec_{lang}_Latn.json files.
# Required for las_mode "base" or "langspec", ignored for "original".
las_tokenizer_path: /home/as3623/unimixlm/olmo3_las_tokenizers/las-tokenizers-Olmo-3-1025-7B-fil
model_tokenizer_path: /home/as3623/unimixlm/olmo3_las_tokenizers/model_tokenizer

seed: 42
epochs: 1
per_device_batch_size: 6
gradient_accumulation_steps: 8
learning_rate: 2e-4
val_fraction: 0.001

dataset:
  size: 100M  # Options: 5M 10M 100M
  max_seq_len: 1024
