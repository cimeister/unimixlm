defaults:
  - model: olmo3-1025-7b
  - logger: wandb-andrzej
  - lora: r16-k32
  - _self_

langs:
  - yor

output_dir: ./finetuned_model
las_tokenizer_path: null

epochs: 1
batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 5e-4
val_fraction: 0.01

dataset:
  size: 10M
  max_seq_len: 1024
  pack_dataset: true
  align_to_max_seq_len: true
  add_eos_between_samples: true
  drop_last_pack: false