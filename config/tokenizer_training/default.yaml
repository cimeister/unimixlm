# Default configuration for olmo_fineweb2 tokenizer training

defaults:
  - languages: yor
  - hf: multilingualunigramlm
  - model: olmo3-1025-7b
  - _self_

data:
  output_dir: ./las_tokenizers/olmo3-7b_v100k_fineweb2sample_10klines_afr-ind-ron-swh_softem
  # 50k is the chosen default. 10k lines/lang proved thin for code langs
  # (Gemma3 JavaScript T4b routing at 72% in P4b code).
  # Record the actual value used per run in this project's own experiment log
  # and keep it in the tokenizer-dir name suffix (e.g. "_50klines_").
  lines_per_lang: 50000
  text_column: text  # Column name in parquet (text for FineWeb2, content for StarCoder)
  # Local parquet directory for tokenizer training data.
  # When set, reads from {local_dir}/{lang}/ instead of HF Hub. Set this to
  # the FineWeb2-sample directory
  # (tokenizer_training/downstream_lm_training_data/fineweb2_sample) on your
  # cluster; left null to require an explicit override.
  local_dir: null

training:
  em_mode: soft # EM mode for tokenizer training ("soft", "hard", "hf")
  train_new_base_tokenizer: true # Set to false to skip base training and use model tokenizer directly
