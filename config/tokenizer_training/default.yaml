# config/code_tokenizer_training/default.yaml
#
# Hydra configuration for run_las_code_tok_training.py
# -------------------------------------------------------
# All 30 programming languages from The-Stack-10K are listed below.
# Comment out or override on the CLI to train a subset:
#
#   python run_las_code_tok_training.py \
#       languages.langs="[python,rust,go]"

languages:
  langs:
    - assembly
    - batchfile
    - c++
    - c
    - c-sharp
    - cmake
    - css
    - dockerfile
    - fortran
    - go
    - haskell
    - html
    - java
    - javascript
    - julia
    - lua
    - makefile
    - markdown
    - perl
    - php
    - powershell
    - python
    - ruby
    - rust
    - scala
    - shell
    - sql
    - tex
    - typescript
    - visual-basic

data:
  output_dir: ./output/code_tokenizers
  # Character budget per language corpus streamed from The-Stack-10K.
  # ~5 MB gives good EM signal; reduce for quick experiments.
  char_budget: 5000000
  # NL pipeline keys. run_las_tok_training.py reads cfg.data.lines_per_lang;
  # the orchestrator overrides corpus_repo_template/corpus_size per sweep.
  # Declared here so OmegaConf struct-mode `key=val` overrides are valid
  # (Day-0 K1 surfaced their absence — see RESULTS_LEDGER).
  lines_per_lang: 10000
  corpus_repo_template: null
  corpus_size: null

model:
  # Seed tokenizer – byte-level models (GPT-2, StarCoder) recommended for code.
  model_name: allenai/OLMo-2-1124-7B

training:
  train_new_base_tokenizer: true
  em_mode: soft   # "soft" | "hard"
  # Target vocabulary size for the LAS base tokenizer. When null, the trainer
  # preserves the seed (model) tokenizer's vocab size. Set to 100000, 150000,
  # or 256000 for the EMNLP vocab-size sweep.
  vocab_size: null
  # EM re-estimation iteration count (the intrinsic-node PRIMARY frontier IV).
  # null → trainer default num_iterations; the sweep overrides per cell.
  iters: null

hf:
  username: MultilingualUnigramLM
  push: true