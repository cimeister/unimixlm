# Default configuration for olmo_fineweb2 tokenizer training

defaults:
  - languages: yor
  - hf: multilingualunigramlm
  - model: olmo3-1025-7b
  - _self_

data:
  output_dir: ./olmo3_las_tokenizers
  lines_per_lang: 10000

training:
  em_mode: soft  # EM mode for base tokenizer training ("soft", "hard", "hf")
  reestimation_em_mode: soft  # EM mode for language-specific re-estimation

execution:
  max_workers: 8
