defaults:
  - _self_

cuda_visible_devices: "0,1"
output_path: ./eval_results

model: hf
model_args:
  pretrained: "allenai/Olmo-3-1025-7B"
  peft_original_tok: "/home/USER/unimixlm/finetuned_model/las_finetuned_Olmo-3-1025-7B_['yo']_original-tokenizer"
  peft_las_tok: "/home/USER/unimixlm/finetuned_model/las_finetuned_Olmo-3-1025-7B_['yo']_las-tokenizer"

eval_langs:
  - en
  - yo

batch_size: auto:4
log_samples: false

custom_tokenizer:
  enabled: false
  las_tokenizer_main_path: "/home/USER/unimixlm/olmo3_las_tokenizers/yor_Latn"
  las_lang: yor
  byte_level: true
  lowercase_if_not_byte_level: true
