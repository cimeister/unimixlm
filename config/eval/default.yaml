defaults:
  - _self_

cuda_visible_devices: "2"
output_path: ./eval_results/yor-quick-modified

model: hf
model_args:
  pretrained: "allenai/Olmo-3-1025-7B"
  peft_original_tok: "/home/as3623/unimixlm/finetuned_model/ft_yor_10M_modified"
  peft_las_tok: "/home/as3623/unimixlm/finetuned_model/ft-las_yor_10M_modified"

eval_langs:
  - en
  - yo

