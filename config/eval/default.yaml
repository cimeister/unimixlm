defaults:
  - _self_

model_lang: yor

output_path: ./eval_results/${model_lang}

model: hf
model_args:
  pretrained: "allenai/Olmo-3-1025-7B"
  peft_original_tok: "/home/as3623/unimixlm/finetuned_model/ft_${model_lang}_10M"
  peft_las_tok: "/home/as3623/unimixlm/finetuned_model/ft-las_${model_lang}_10M"

eval_langs:
  - eng
  - ${model_lang}

tasks:
  - mmlu
  - belebele
  - piqa

batch_size: auto
log_samples: false

custom_tokenizer:
  enabled: true
  las_lang: ${model_lang}
  las_tokenizer_main_path: "/home/as3623/unimixlm/olmo3_las_tokenizers_new/${model_lang}_Latn"
  byte_level: true
  lowercase_if_not_byte_level: true
