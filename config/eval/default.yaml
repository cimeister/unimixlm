defaults:
  - _self_

model_lang: fil

output_path: ./eval_results/${model_lang}

model: hf
model_args:
  pretrained: "allenai/Olmo-3-1025-7B"
  peft_original_tok: "./finetuned_model/ft_${model_lang}-eng_100M"
  peft_las_tok: "./finetuned_model/ft-las-langspec_${model_lang}-eng_100M"

eval_langs:
  - eng
  - ${model_lang}

tasks:
  - mmlu
  - belebele
  - piqa

batch_size: auto
dtype: bfloat16
log_samples: false

eval_base:
  enabled: true
eval_ft:
  enabled: true
custom_tokenizer:
  enabled: true
  las_lang: ${model_lang}
  las_mode: langspec
  las_tokenizer_main_path: "./olmo3_las_tokenizers/las-tokenizers-Olmo-3-1025-7B-${model_lang}"
