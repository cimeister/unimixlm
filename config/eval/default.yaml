defaults:
  - _self_

model_lang: afr

output_path: ./eval_results/${model_lang}

model: hf
model_args:
  pretrained: "allenai/Olmo-3-1025-7B"
  # Checkpoint paths are per-run and machine-specific; there is no shared
  # default. Set each of these on the command line (or in a per-run override
  # file) before running an eval.
  peft_original_tok: ???
  peft_base_tok: ???
  peft_pathpiece_tok: ???
  peft_las_tok: ???

eval_langs:
  - eng
  - ${model_lang}

tasks:
  # - mmlu
  - belebele
  - piqa
  - multiblimp
  - turblimp

batch_size: auto
log_samples: false

eval_base:
  enabled: true
eval_ft:
  enabled: true
eval_ft_base:
  enabled: true
  base_tokenizer_path: "./las_tokenizers/olmo3-7b_v100k_fineweb2sample_10klines_afr-ind-ron-swh_softem/base_tokenizer.json"
eval_ft_pathpiece:
  enabled: true
  pathpiece_tokenizer_path: "./las_tokenizers/olmo3-7b_v100k_fineweb2sample_10klines_afr-ind-ron-swh_softem/pathpiece_tokenizer.json"

custom_tokenizer:
  enabled: true
  las_lang: ${model_lang}
  las_tokenizer_main_path: "./las_tokenizers/olmo3-7b_v100k_fineweb2sample_10klines_afr-ind-ron-swh_softem"
