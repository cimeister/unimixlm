custom_tokenizer:
  enabled: true
  las_lang: yor
  las_tokenizer_main_path: "/home/as3623/unimixlm/olmo3_las_tokenizers_new/${custom_tokenizer.las_lang}_Latn"
  byte_level: true
  lowercase_if_not_byte_level: true
