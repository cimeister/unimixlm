defaults:
  - _self_

model_lang: python

output_path: ./eval_results/code_${model_lang}

model: hf
model_args:
  pretrained: "allenai/OLMo-2-1124-7B"
  peft_original_tok: "./finetuned_model/ft-code_${model_lang}_100M"
  peft_las_tok: "./finetuned_model/ft-code-las-langspec_${model_lang}_100M"

eval_langs:
  - ${model_lang}

# Code evaluation benchmarks:
#   humaneval   - HumanEval code generation (Python-focused)
#   mbpp        - Mostly Basic Python Problems
#   multiple_e  - MultiPL-E multilingual code generation
tasks:
  - humaneval
  - mbpp
  - multiple_e

batch_size: "auto:4"
dtype: bfloat16
log_samples: false

eval_base:
  enabled: true
eval_ft:
  enabled: true
custom_tokenizer:
  enabled: true
  las_lang: ${model_lang}
  las_mode: langspec
  las_domain: code
  las_tokenizer_main_path: "./code_las_tokenizers/las-code-tokenizers-OLMo-2-1124-7B"
